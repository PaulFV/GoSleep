<style>

:root{
    --bg:#05060B;
    --card:rgba(19,22,36,0.55);
    --card-border:rgba(255,255,255,0.08);
    --cyan:#00E5FF;
    --violet:#8C6BFF;
    --magenta:#FF3D8A;
    --text:#EDEFFA;
    --text-dim:#727893;
    --mono:'JetBrains Mono',monospace;
    --display:'Space Grotesk',sans-serif;
    --safe-top:env(safe-area-inset-top,0px);
    --safe-bottom:env(safe-area-inset-bottom,0px);
}

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    overscroll-behavior:none;
    height:100%;
}

body{
    margin:0;
    background:var(--bg);
    background-image:
        radial-gradient(ellipse 800px 500px at 50% -10%, rgba(140,107,255,0.22), transparent 60%),
        radial-gradient(ellipse 600px 400px at 90% 20%, rgba(0,229,255,0.10), transparent 60%),
        linear-gradient(180deg,#05060B 0%,#07080F 100%);
    background-attachment:fixed;
    font-family:var(--display);
    color:var(--text);
    -webkit-font-smoothing:antialiased;
    position:relative;
}

/* faint grid / scanline texture */
body::before{
    content:'';
    position:fixed;
    inset:0;
    background-image:
        linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
    background-size:34px 34px;
    pointer-events:none;
    z-index:0;
    mask-image:radial-gradient(ellipse 100% 60% at 50% 0%, black, transparent 75%);
}

/* ---------- Header ---------- */
.header{
    padding:calc(var(--safe-top) + 14px) 20px 14px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    position:sticky;
    top:0;
    z-index:20;
    background:rgba(5,6,11,0.72);
    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);
    border-bottom:1px solid rgba(255,255,255,0.05);
}

.logo{
    font-size:22px;
    font-weight:700;
    letter-spacing:0.5px;
    display:flex;
    align-items:center;
    gap:8px;
    background:linear-gradient(90deg,var(--cyan),var(--violet));
    -webkit-background-clip:text;
    background-clip:text;
    -webkit-text-fill-color:transparent;
}

.logo .dot{
    width:7px;
    height:7px;
    border-radius:50%;
    background:var(--cyan);
    box-shadow:0 0 10px 2px var(--cyan);
    -webkit-text-fill-color:initial;
    display:inline-block;
}

.profile{
    display:flex;
    align-items:center;
    gap:9px;
}

.avatar{
    width:32px;
    height:32px;
    border-radius:9px;
    background:linear-gradient(135deg,var(--cyan),var(--violet));
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:700;
    color:#05060B;
    font-size:14px;
    font-family:var(--mono);
}

#userName{
    font-size:13.5px;
    color:var(--text-dim);
    font-family:var(--mono);
    letter-spacing:0.3px;
}

/* ---------- Layout ---------- */
.container{
    padding:8px 18px 18px;
    max-width:720px;
    margin:0 auto;
    padding-bottom:calc(104px + var(--safe-bottom));
    position:relative;
    z-index:1;
}

/* ---------- Hero: orbit + waveform ---------- */
.hero{
    text-align:center;
    padding:26px 0 10px;
    position:relative;
}

.orbit-wrap{
    position:relative;
    width:210px;
    height:210px;
    margin:0 auto;
    display:flex;
    align-items:center;
    justify-content:center;
}

.orbit-ring{
    position:absolute;
    border-radius:50%;
    border:1px solid rgba(0,229,255,0.18);
}

.orbit-ring.r1{ width:210px; height:210px; animation:spin 22s linear infinite; border-top-color:var(--cyan); }
.orbit-ring.r2{ width:160px; height:160px; animation:spin 16s linear infinite reverse; border-right-color:var(--violet); border-color:rgba(140,107,255,0.16); }
.orbit-ring.r3{ width:112px; height:112px; border:1px dashed rgba(255,255,255,0.12); animation:spin 40s linear infinite; }

@keyframes spin{
    to{ transform:rotate(360deg); }
}

.moon{
    width:92px;
    height:92px;
    position:relative;
    z-index:2;
    filter:drop-shadow(0 0 20px rgba(57,255,138,0.75)) drop-shadow(0 0 40px rgba(57,255,138,0.35));
}

.moon svg{
    width:100%;
    height:100%;
    display:block;
}

.hero p{
    color:var(--text-dim);
    font-size:14px;
    margin:16px 0 0;
    font-family:var(--mono);
    letter-spacing:0.4px;
    text-transform:uppercase;
}

/* neural wave */
.wave-box{
    height:46px;
    margin:14px 0 4px;
    overflow:hidden;
    position:relative;
}

.wave-box svg{
    width:200%;
    height:100%;
    animation:waveScroll 7s linear infinite;
}

@keyframes waveScroll{
    from{ transform:translateX(0); }
    to{ transform:translateX(-50%); }
}

/* ---------- Cards ---------- */
.cards{
    display:grid;
    grid-template-columns:1fr;
    gap:14px;
    margin-top:14px;
}

@media (min-width:640px){
    .cards{ grid-template-columns:1fr 1fr; }
    .card.wide{ grid-column:1 / -1; }
}

@media (min-width:900px){
    .container{ max-width:840px; }
}

.card{
    background:var(--card);
    border:1px solid var(--card-border);
    border-radius:18px;
    padding:20px;
    backdrop-filter:blur(20px);
    -webkit-backdrop-filter:blur(20px);
    box-shadow:0 8px 30px rgba(0,0,0,0.35), inset 0 1px 0 rgba(255,255,255,0.04);
    position:relative;
    overflow:hidden;
}

.card::before{
    content:'';
    position:absolute;
    top:0; left:0; right:0;
    height:1px;
    background:linear-gradient(90deg,transparent,rgba(0,229,255,0.5),transparent);
}

.card-label{
    display:flex;
    align-items:center;
    gap:8px;
    color:var(--text-dim);
    font-size:12.5px;
    font-weight:600;
    text-transform:uppercase;
    letter-spacing:1px;
    margin-bottom:14px;
    font-family:var(--mono);
}

/* quality ring */
.quality-row{
    display:flex;
    align-items:center;
    gap:18px;
}

.ring{
    --pct:0;
    width:82px;
    height:82px;
    border-radius:50%;
    flex-shrink:0;
    background:conic-gradient(var(--cyan) calc(var(--pct)*1%), rgba(255,255,255,0.06) 0);
    display:flex;
    align-items:center;
    justify-content:center;
    transition:background 0.6s ease;
    filter:drop-shadow(0 0 10px rgba(0,229,255,0.35));
}

.ring-inner{
    width:64px;
    height:64px;
    border-radius:50%;
    background:#0B0D18;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:18px;
    font-weight:600;
    font-family:var(--mono);
    color:var(--cyan);
}

.quality-text h1{
    margin:0 0 4px;
    font-size:17px;
    font-weight:600;
    font-family:var(--mono);
}

.quality-text p{

    color:var(--text-dim);
    font-size:13.5px;
}

.big-value{
    font-size:29px;
    font-weight:700;
    margin:0 0 4px;

    color:var(--text);
}

.sub-value{
    color:var(--text-dim);
    font-size:13.5px;
    margin:0;
}

.stat-line{
    display:flex;

.stat-line:last-child{ border-bottom:none; }

}

.cycle-list{

.cycle-list li{

/* ---------- Bottom tab bar ---------- */

/* ---------- Bottom sheets ---------- */
.sheet-overlay{

@media (prefers-reduced-motion:reduce){

<script>

const state = {
    userName: localStorage.getItem('gs_userName') || 'Paul',
    targetHours: parseFloat(localStorage.getItem('gs_targetHours')) || 8,
    alarmTime: localStorage.getItem('gs_alarmTime') || '',
    sleepStart: localStorage.getItem('gs_sleepStart') || null,
    log: JSON.parse(localStorage.getItem('gs_log') || '[]'),
    journal: JSON.parse(localStorage.getItem('gs_journal') || '[]')
};

function save(key, value){
    localStorage.setItem(key, typeof value === 'string' ? value : JSON.stringify(value));
}

function pad(n){ return n.toString().padStart(2,'0'); }
function fmtTime(date){ return pad(date.getHours()) + ':' + pad(date.getMinutes()); }
function fmtDuration(minutes){
    const h = Math.floor(minutes/60);
    const m = Math.round(minutes%60);
    return h + 'h ' + m + 'min';
}

function calcQuality(durationMin){
    const targetMin = state.targetHours * 60;
    const diff = Math.abs(durationMin - targetMin);
    let quality = 98 - (diff/targetMin)*60;
    return Math.max(40, Math.min(98, Math.round(quality)));
}

function renderHeader(){
    document.getElementById('userName').textContent = state.userName.toUpperCase();
    document.getElementById('avatarInitial').textContent = state.userName.charAt(0).toUpperCase();
}

function renderSleepCard(){
    const ring = document.getElementById('qualityRing');
    if(state.log.length === 0){
        ring.style.setProperty('--pct', 0);
        document.getElementById('qualityValue').textContent = '–';
        document.getElementById('durationText').textContent = 'Keine Daten';
        return;
    }
    const last = state.log[state.log.length-1];
    ring.style.setProperty('--pct', last.quality);
    document.getElementById('qualityValue').textContent = last.quality + '%';
    document.getElementById('durationText').textContent = fmtDuration(last.durationMin);
}

function renderAlarmCard(){
    document.getElementById('alarmValue').textContent = state.alarmTime ? state.alarmTime : '–:–';
}

function renderStatsCard(){
    if(state.log.length === 0){
        document.getElementById('statWeek').textContent = '–';
        document.getElementById('statMonth').textContent = '–';
        document.getElementById('statQuality').textContent = '–';
        return;
    }
    const now = new Date();
    const weekAgo = new Date(now - 7*24*60*60*1000);
    const monthAgo = new Date(now - 30*24*60*60*1000);
    const weekEntries = state.log.filter(e => new Date(e.date) >= weekAgo);
    const monthEntries = state.log.filter(e => new Date(e.date) >= monthAgo);
    const avg = arr => arr.length ? arr.reduce((s,e)=>s+e.durationMin,0)/arr.length : 0;
    const avgQ = arr => arr.length ? Math.round(arr.reduce((s,e)=>s+e.quality,0)/arr.length) : 0;

    document.getElementById('statWeek').textContent = weekEntries.length ? fmtDuration(avg(weekEntries)) : '–';
    document.getElementById('statMonth').textContent = monthEntries.length ? fmtDuration(avg(monthEntries)) : '–';
    document.getElementById('statQuality').textContent = monthEntries.length ? avgQ(monthEntries) + '%' : '–';
}

function renderCycles(){
    const list = document.getElementById('cycleList');
    list.innerHTML = '';
    const now = new Date();
    const fallAsleep = new Date(now.getTime() + 14*60000);
    [4,5,6].forEach(cycles => {
        const wake = new Date(fallAsleep.getTime() + cycles*90*60000);
        const li = document.createElement('li');
        li.innerHTML = '<span>' + cycles + ' Zyklen</span><b>' + fmtTime(wake) + ' Uhr</b>';
        list.appendChild(li);
    });
}

function escapeHtml(str){
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
}

function renderJournalHistory(){
    const container = document.getElementById('journalHistory');
    if(state.journal.length === 0){
        container.innerHTML = '<p class="empty">Noch keine Einträge vorhanden.</p>';
        return;
    }
    container.innerHTML = state.journal.slice().reverse().map(e => {
        const d = new Date(e.date);
        return '<div class="journal-entry"><div class="date">' + d.toLocaleDateString('de-DE') + ' · ' + fmtTime(d) + ' UHR</div>' + escapeHtml(e.text) + '</div>';
    }).join('');
}

function renderStatsHistory(){
    const container = document.getElementById('statsHistory');
    if(state.log.length === 0){
        container.innerHTML = '<p class="empty">Noch keine Schlafdaten vorhanden.</p>';
        return;
    }
    container.innerHTML = state.log.slice().reverse().map(e => {
        const d = new Date(e.date);
        return '<div class="stat-line"><span>' + d.toLocaleDateString('de-DE') + '</span><span>' + fmtDuration(e.durationMin) + ' · ' + e.quality + '%</span></div>';
    }).join('');
}

function renderAll(){
    renderHeader();
    renderSleepCard();
    renderAlarmCard();
    renderStatsCard();
    renderCycles();
}

const sleepBtn = document.getElementById('sleepBtn');
const heroText = document.getElementById('heroText');

function updateSleepButton(){
    if(state.sleepStart){
        sleepBtn.textContent = '☀️ Aufwachen';
        sleepBtn.classList.add('active');
        heroText.textContent = 'Aufzeichnung läuft …';
    } else {
        sleepBtn.textContent = '🌙 Schlafmodus starten';
        sleepBtn.classList.remove('active');
        heroText.textContent = 'System bereit';
    }
}

sleepBtn.addEventListener('click', () => {
    if(!state.sleepStart){
        state.sleepStart = new Date().toISOString();
        save('gs_sleepStart', state.sleepStart);
    } else {
        const start = new Date(state.sleepStart);
        const end = new Date();
        let durationMin = (end - start) / 60000;
        if(durationMin < 1) durationMin = 1;
        const quality = calcQuality(durationMin);

        state.log.push({ date: end.toISOString(), durationMin, quality });
        save('gs_log', state.log);

        state.sleepStart = null;
        localStorage.removeItem('gs_sleepStart');

        renderSleepCard();
        renderStatsCard();
    }
    updateSleepButton();
});

function openSheet(id){
    document.getElementById(id).classList.add('open');
    document.body.style.overflow = 'hidden';
}
function closeSheet(id){
    document.getElementById(id).classList.remove('open');
    document.body.style.overflow = '';
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelector('.tab[data-tab="home"]').classList.add('active');
}
document.querySelectorAll('[data-close]').forEach(btn => {
    btn.addEventListener('click', () => closeSheet(btn.dataset.close));
});
document.querySelectorAll('.sheet-overlay').forEach(ov => {
    ov.addEventListener('click', (e) => {
        if(e.target === ov) closeSheet(ov.id);
    });
});

function setActiveTab(id){
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.getElementById(id).classList.add('active');
}

document.getElementById('alarmBtn').addEventListener('click', () => {
    document.getElementById('alarmTimeInput').value = state.alarmTime;
    openSheet('alarmOverlay');
    setActiveTab('alarmBtn');
});
document.getElementById('saveAlarmBtn').addEventListener('click', () => {
    const val = document.getElementById('alarmTimeInput').value;
    if(val){
        state.alarmTime = val;
        save('gs_alarmTime', val);
        renderAlarmCard();
    }
    closeSheet('alarmOverlay');
});

document.getElementById('statsBtn').addEventListener('click', () => {
    renderStatsHistory();
    openSheet('statsOverlay');
    setActiveTab('statsBtn');
});

document.getElementById('journalBtn').addEventListener('click', () => {
    renderJournalHistory();
    openSheet('journalOverlay');
    setActiveTab('journalBtn');
});
document.getElementById('saveJournalBtn').addEventListener('click', () => {
    const text = document.getElementById('journalInput').value.trim();
    if(text){
        state.journal.push({ date: new Date().toISOString(), text });
        save('gs_journal', state.journal);
        document.getElementById('journalInput').value = '';
        renderJournalHistory();
    }
});

document.getElementById('settingsBtn').addEventListener('click', () => {
    document.getElementById('nameInput').value = state.userName;
    document.getElementById('targetInput').value = state.targetHours;
    openSheet('settingsOverlay');
    setActiveTab('settingsBtn');
});
document.getElementById('saveSettingsBtn').addEventListener('click', () => {
    const name = document.getElementById('nameInput').value.trim();
    const target = parseFloat(document.getElementById('targetInput').value);

    if(name){
        state.userName = name;
        save('gs_userName', name);
    }
    if(!isNaN(target) && target > 0){
        state.targetHours = target;
        save('gs_targetHours', target);
    }
    renderHeader();
    renderSleepCard();
    closeSheet('settingsOverlay');
});

updateSleepButton();
renderAll();
setInterval(renderCycles, 60000);

</script>

</body>
</html>
